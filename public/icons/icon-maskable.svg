<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Version "maskable" (a sangre, sin esquinas redondeadas: el sistema recorta la forma).
       El dibujo esta reducido al 80 % para quedar dentro de la zona segura. -->
  <defs>
    <linearGradient id="brazo" gradientUnits="userSpaceOnUse" x1="118" y1="0" x2="394" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cuadricula" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="2"/>
    </pattern>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="difuso"/>
      <feMerge><feMergeNode in="difuso"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#05070d"/>
  <rect width="512" height="512" fill="url(#cuadricula)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <g transform="translate(256 270) scale(0.8) translate(-256 -270)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 168V376" stroke="#e6edf7" stroke-width="18"/>
    <path d="M190 386H322" stroke="#e6edf7" stroke-width="18"/>

    <g filter="url(#neon)">
      <path d="M118 176H394" stroke="url(#brazo)" stroke-width="20"/>
      <circle cx="256" cy="150" r="17" fill="#05070d" stroke="url(#brazo)" stroke-width="12"/>

      <path d="M118 176L82 286M118 176L154 286" stroke="#22d3ee" stroke-width="7"/>
      <path d="M394 176L358 286M394 176L430 286" stroke="#a78bfa" stroke-width="7"/>

      <path d="M70 286H166A48 42 0 0 1 70 286Z" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="9"/>
      <path d="M118 290V318M104 304H132" stroke="#34d399" stroke-width="8"/>

      <path d="M346 286H442A48 42 0 0 1 346 286Z" fill="#fb7185" fill-opacity="0.16" stroke="#fb7185" stroke-width="9"/>
      <path d="M380 304H408" stroke="#fb7185" stroke-width="8"/>
    </g>
  </g>
</svg>
